<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/overlay.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>nox-voice overlay</title>
    <script type="module" src="/src/overlay.ts" defer></script>
  </head>

  <body>
    <div class="pill" id="pill" data-state="idle" hidden>
      <!-- 状態アイコンは描いた図形。状態ごとに 1 つだけ表示する。 -->
      <span class="icon" id="icon" aria-hidden="true">
        <svg viewBox="0 0 20 20" class="glyph glyph-mic">
          <path
            d="M10 3.2a2.2 2.2 0 0 1 2.2 2.2v4.2a2.2 2.2 0 1 1-4.4 0V5.4A2.2 2.2 0 0 1 10 3.2Z"
            fill="currentColor"
          />
          <path
            d="M5.5 9.4a4.5 4.5 0 0 0 9 0M10 13.9v2.9"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
          />
        </svg>
        <svg viewBox="0 0 20 20" class="glyph glyph-spinner">
          <circle
            cx="10"
            cy="10"
            r="6.4"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-dasharray="10 30"
          />
        </svg>
        <svg viewBox="0 0 20 20" class="glyph glyph-check">
          <path
            d="m4.8 10.4 3.4 3.4 7-7.6"
            fill="none"
            stroke="currentColor"
            stroke-width="1.9"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        <!-- クリップボードのみモード・画面質問モードの完了アイコン。
             貼り付けをしない設計なので、チェックとは別の絵にして
             「まだ Ctrl+V が要る」と分かるようにする。 -->
        <svg viewBox="0 0 20 20" class="glyph glyph-clipboard">
          <rect
            x="5.4"
            y="4.6"
            width="9.2"
            height="12"
            rx="1.6"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
          />
          <path
            d="M8 4.4a2 2 0 0 1 4 0"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
          />
          <path
            d="M7.6 9.2h4.8M7.6 12h4.8M7.6 14.8h3.2"
            fill="none"
            stroke="currentColor"
            stroke-width="1.4"
            stroke-linecap="round"
          />
        </svg>
        <svg viewBox="0 0 20 20" class="glyph glyph-alert">
          <circle
            cx="10"
            cy="10"
            r="6.6"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
          />
          <path
            d="M10 6.4v4"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
          />
          <circle cx="10" cy="13.1" r="0.95" fill="currentColor" />
        </svg>
      </span>

      <div class="body">
        <div class="line">
          <span class="label" id="label">録音中</span>
          <span class="elapsed" id="elapsed"></span>
        </div>

        <div class="meter" id="meter" hidden>
          <div class="meter-fill" id="meter-fill"></div>
        </div>

        <div class="detail" id="detail" hidden></div>
      </div>
    </div>
  </body>
</html>
