<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/overlay.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>nox-voice overlay</title>
    <script type="module" src="/src/overlay.ts" defer></script>
  </head>

  <body>
    <div class="pill" id="pill" data-state="idle" hidden>
      <!-- 状態アイコンは描いた図形。状態ごとに 1 つだけ表示する。 -->
      <span class="icon" id="icon" aria-hidden="true">
        <svg viewBox="0 0 20 20" class="glyph glyph-mic">
          <path
            d="M10 3.2a2.2 2.2 0 0 1 2.2 2.2v4.2a2.2 2.2 0 1 1-4.4 0V5.4A2.2 2.2 0 0 1 10 3.2Z"
            fill="currentColor"
          />
          <path
            d="M5.5 9.4a4.5 4.5 0 0 0 9 0M10 13.9v2.9"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
          />
        </svg>
        <svg viewBox="0 0 20 20" class="glyph glyph-spinner">
          <circle
            cx="10"
            cy="10"
            r="6.4"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-dasharray="10 30"
          />
        </svg>
        <svg viewBox="0 0 20 20" class="glyph glyph-check">
          <path
            d="m4.8 10.4 3.4 3.4 7-7.6"
            fill="none"
            stroke="currentColor"
            stroke-width="1.9"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        <!-- クリップボードのみモード・画面質問モードの完了アイコン。
             貼り付けをしない設計なので、チェックとは別の絵にして
             「まだ Ctrl+V が要る」と分かるようにする。 -->
        <svg viewBox="0 0 20 20" class="glyph glyph-clipboard">
          <rect
            x="5.4"
            y="4.6"
            width="9.2"
            height="12"
            rx="1.6"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
          />
          <path
            d="M8 4.4a2 2 0 0 1 4 0"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
          />
          <path
            d="M7.6 9.2h4.8M7.6 12h4.8M7.6 14.8h3.2"
            fill="none"
            stroke="currentColor"
            stroke-width="1.4"
            stroke-linecap="round"
          />
        </svg>
        <svg viewBox="0 0 20 20" class="glyph glyph-alert">
          <circle
            cx="10"
            cy="10"
            r="6.6"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
          />
          <path
            d="M10 6.4v4"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
          />
          <circle cx="10" cy="13.1" r="0.95" fill="currentColor" />
        </svg>
      </span>

      <div class="body">
        <div class="line">
          <span class="label" id="label">録音中</span>
          <span class="elapsed" id="elapsed"></span>
        </div>

        <!-- 相手ウィンドウ (録音中・処理中のみ)。通常モードは貼付先、
             画面質問モードは「前景アプリ + 読むモニタ」。クリップボード
             のみモードでは Rust 側が送ってこないので出ない。 -->
        <div class="target" id="target" hidden>
          <span class="target-icon">
            <!-- アイコンが届くまでの枠。同じ 14px を占めるので、
                 到着してもレイアウトが跳ねない。 -->
            <svg viewBox="0 0 16 16" class="target-glyph" aria-hidden="true">
              <rect
                x="1.75"
                y="2.75"
                width="12.5"
                height="10.5"
                rx="1.8"
                fill="none"
                stroke="currentColor"
                stroke-width="1.3"
              />
              <path
                d="M1.75 6.1h12.5"
                fill="none"
                stroke="currentColor"
                stroke-width="1.3"
              />
            </svg>
            <!-- アイコンが届くまでは 1x1 の透明画像。src 無しの <img> を
                 置くと、環境によっては壊れた画像の枠が出る。中身は
                 nox://target-icon で差し替わり、見え方は data-icon が
                 決める (opacity のみ)。 -->
            <img
              class="target-img"
              id="target-img"
              alt=""
              src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"
            />
          </span>
          <span class="target-name">
            <span class="target-app" id="target-app"></span
            ><span class="target-title" id="target-title"></span>
          </span>
        </div>

        <!-- 画面質問モードで、モニタが 2 枚以上あるときだけ出る補足。 -->
        <div class="hint" id="hint" hidden></div>

        <div class="meter" id="meter" hidden>
          <div class="meter-fill" id="meter-fill"></div>
        </div>

        <div class="detail" id="detail" hidden></div>
      </div>
    </div>
  </body>
</html>
