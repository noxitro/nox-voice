<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>nox-voice</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <main class="container">
      <h1>nox-voice</h1>

      <section class="status-card" id="status-card" data-status="idle">
        <span class="status-dot" aria-hidden="true"></span>
        <span class="status-text" id="status-text">待機中</span>
      </section>

      <p class="hint">
        右 Ctrl を<strong>長押し</strong>している間だけ録音(離すと確定)。<br />
        右 Ctrl を<strong>短押し</strong>すると録音が継続し、もう一度押すと停止。
      </p>

      <section class="panel">
        <h2>直近の録音</h2>
        <dl class="kv" id="session">
          <dt>状態</dt>
          <dd id="session-empty">まだ録音していません</dd>
        </dl>
      </section>

      <p class="error" id="error" hidden></p>
    </main>
  </body>
</html>
