[package]
name = "nox-voice"
version = "0.1.0"
description = "Windows 11 向け AI 音声入力常駐アプリ"
authors = ["noxitro"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "nox_voice_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
crossbeam-channel = "0.5"
cpal = "0.18"
hound = "3.5"
# 本アプリは Windows 11 専用(WH_KEYBOARD_LL / 前景 HWND 取得に依存)。
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    # GetModuleHandleW。疑似 E2E (instance.rs の `sim`) が
    # tauri-plugin-single-instance と同じ作りの受信ウィンドウを立てるのに要る。
    "Win32_System_LibraryLoader",
    # GetSystemTime。ロガー初期化前に出す多重起動ログの時刻に使う (instance.rs)。
    # tauri-plugin-log の既定が UTC なので、こちらも UTC で揃える。
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    # CreateMutexW の SECURITY_ATTRIBUTES 型に必要 (値は既定の NULL を渡す)。
    "Win32_Security",
    # 画面質問モード (screen.rs): モニタの列挙と画面のキャプチャ。
    "Win32_Graphics_Gdi",
    # 同: DWMWA_CLOAKED。IsWindowVisible だけでは、別の仮想デスクトップに
    # 置いてあるウィンドウまで「見えている」ことになってしまう。
    "Win32_Graphics_Dwm",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
reqwest = { version = "0.13", features = ["blocking", "json", "multipart"] }
tauri-plugin-notification = "2.3.3"
rusqlite = { version = "0.40.2", features = ["bundled"] }
whisper-rs = { version = "0.16", default-features = false, optional = true }
sha2 = "0.11.0"
# 画面質問モードのスクリーンショット。
# JPEG ではなく PNG なのは、資料の主たる内容が文字だから (screen.rs 参照)。
# どちらも tauri の依存として既に lock に載っているので、ビルド時間は増えない。
png = "0.17"
base64 = "0.22"

[features]
default = []

# ローカル STT (whisper.cpp バインディング)。
#
# 既定で無効にしてあるのは、whisper.cpp のビルドに CMake と C++ ツールチェーンが
# 要り、環境によっては通らないため。ネットワークや API キーが使えないときの
# 代替手段なので、本体のビルドを人質に取らせない。
#
#   cargo build --features local-stt
local-stt = ["dep:whisper-rs"]

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2.4.3"
