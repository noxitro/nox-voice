[package]
name = "nox-voice"
version = "0.2.0"
description = "Windows 11 向け AI 音声入力常駐アプリ"
authors = ["noxitro"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "nox_voice_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
crossbeam-channel = "0.5"
cpal = "0.18"
hound = "3.5"
# `#[implement]` マクロが生成するコードは `::windows_core::` を絶対パスで
# 参照する。`windows` 経由の再エクスポートでは届かないので直接の依存を持つ。
# バージョンは `windows` 0.62 が使っているものと同一 (lock で共有される)。
# 辞書の自動学習 (learn.rs) が UIA のイベントハンドラを実装するため、
# **本番ビルドにも要る** (かつては uia_spike 用に dev-dependencies だけだった)。
windows-core = "0.62"
# WinRT の非同期 (`IAsyncOperation`) の完了ハンドラ型。ローカル OCR の
# `RecognizeAsync` を**時間を切って**待つのに要る (screen/win32.rs)。
# `windows` 0.62 はこれを再エクスポートしていないので、`windows-core` と
# 同じ理由で直接の依存を持つ。バージョンは lock で共有される 0.3.x。
windows-future = "0.3"
# 本アプリは Windows 11 専用(WH_KEYBOARD_LL / 前景 HWND 取得に依存)。
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    # GetModuleHandleW。疑似 E2E (instance.rs の `sim`) が
    # tauri-plugin-single-instance と同じ作りの受信ウィンドウを立てるのに要る。
    "Win32_System_LibraryLoader",
    # GetSystemTime。ロガー初期化前に出す多重起動ログの時刻に使う (instance.rs)。
    # tauri-plugin-log の既定が UTC なので、こちらも UTC で揃える。
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    # CreateMutexW の SECURITY_ATTRIBUTES 型に必要 (値は既定の NULL を渡す)。
    "Win32_Security",
    # 画面質問モード (screen.rs): モニタの列挙と画面のキャプチャ。
    "Win32_Graphics_Gdi",
    # 同: DWMWA_CLOAKED。IsWindowVisible だけでは、別の仮想デスクトップに
    # 置いてあるウィンドウまで「見えている」ことになってしまう。
    "Win32_Graphics_Dwm",
    # ローカル OCR (screen/win32.rs)。UIA で読めなかったウィンドウを、
    # クラウドへ画像を送る**前に**その場で文字に起こすため。
    # ここは Win32 ではなく WinRT の名前空間なので接頭辞が付かない。
    # - Media_Ocr        : OcrEngine 本体
    # - Graphics_Imaging : SoftwareBitmap (画素をエンジンへ渡す器)
    # - Storage_Streams  : DataWriter (Vec<u8> → IBuffer)
    # - Foundation       : 非同期 (RecognizeAsync) の待ち合わせ
    # - Globalization    : OcrEngine::RecognizerLanguage() の戻り値 Language。
    #                      認識言語で単語の連結規則を変えるので要る
    #                      (日本語を空白でつなぐと固有名詞が割れる)
    "Media_Ocr",
    "Graphics_Imaging",
    "Storage_Streams",
    "Foundation",
    "Globalization",
    # 小窓に出す相手アプリの表示名とアイコン (app_icon.rs)。
    # - Win32_UI_Shell           : SHGetFileInfoW (exe → 16px のアイコン)
    # - Win32_Storage_FileSystem : GetFileVersionInfoW / VerQueryValueW
    #                              (版情報の FileDescription = 「Google Chrome」)
    "Win32_UI_Shell",
    "Win32_Storage_FileSystem",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
reqwest = { version = "0.13", features = ["blocking", "json", "multipart"] }
tauri-plugin-notification = "2.3.3"
rusqlite = { version = "0.40.2", features = ["bundled"] }
whisper-rs = { version = "0.16", default-features = false, optional = true }
sha2 = "0.11.0"
# 画面質問モードのスクリーンショット。
# JPEG ではなく PNG なのは、資料の主たる内容が文字だから (screen.rs 参照)。
# どちらも tauri の依存として既に lock に載っているので、ビルド時間は増えない。
png = "0.17"
base64 = "0.22"

[features]
default = []

# ローカル STT (whisper.cpp バインディング)。
#
# 既定で無効にしてあるのは、whisper.cpp のビルドに CMake と C++ ツールチェーンが
# 要り、環境によっては通らないため。ネットワークや API キーが使えないときの
# 代替手段なので、本体のビルドを人質に取らせない。
#
#   cargo build --features local-stt
local-stt = ["dep:whisper-rs"]

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2.4.3"
