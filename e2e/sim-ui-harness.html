<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>nox-voice 疑似 E2E ハーネス</title>
    <!--
      メインウィンドウの疑似 E2E 用の器。**アプリを起動せずに** vite dev サーバへ
      ブラウザで入り、`index.html` の DOM と `src/main.ts` をそのまま動かす。

      # 実機 E2E (e2e/hotkey.mjs) との違い

      あちらは nox-voice.exe を起こし、WebView2 の CDP からメインウィンドウの
      DOM を叩き、**本物の Rust コマンドと本物のグローバルフック**を通す。
      こちらが通すのは DOM とフロントエンドのロジックだけで、Rust 側は
      `window.__TAURI_INTERNALS__` の差し替えで模擬する。

      - 確かめられる: 区画の出し分け、捕獲 UI の表示遷移、保存パッチの中身、
        欠測時のフォールバック、無効化の連動、デバウンスとページング、
        エラー帯の残留、狭い窓での横あふれ。
      - 確かめられない: invoke が本当に Rust へ届くか、コマンド名・引数名が
        Rust 側と合っているか (ここは模擬なので**綴りを間違えても通る**)、
        グローバルホットキーの捕獲、WebView2 固有の描画差、実ウィンドウの
        最小サイズ制約 (tauri.conf.json)。**モックの戻り値を Rust の型に
        合わせること**が、この器の価値をかろうじて支えている唯一の綱。

      # なぜ index.html を写経しないのか

      DOM を丸ごとコピーすると、本体を直した日からテストは別物を見始める
      (静かに腐るテストは、無いより悪い)。ここでは実行時に `/index.html` を
      fetch して body をそのまま移植し、`/src/main.ts` を後から import する。
      import の前にモックを置けるので、`invoke` が本物を掴む隙が無い。
    -->
    <script>
      // ---- Rust 側の模擬 -------------------------------------------------
      //
      // 戻り値は `src-tauri/src/config.rs` の ConfigView と
      // `src-tauri/src/lib.rs` の各 #[tauri::command] の戻り値に合わせてある。
      // ここを適当な形にすると「通るが何も保証しないテスト」になる。
      (() => {
        const params = new URLSearchParams(location.search);
        /** 失敗させたいコマンド (`?fail=list_sound_presets`)。 */
        const failing = new Set((params.get("fail") ?? "").split(",").filter(Boolean));

        /** ConfigView (src-tauri/src/config.rs)。SoundPreset は snake_case。 */
        const config = {
          groq_key_set: true,
          groq_key_source: "config",
          groq_key_preview: "gsk_…9f2a",
          gemini_key_set: false,
          gemini_key_source: "none",
          gemini_key_preview: "",
          language: "ja",
          // 辞書は 2026-08-30 から構造化 (表記 / よみ / ★ / 追加日時 / 出所)。
          // 出所は 2 種類そろえる — 1 種類だけだと絞り込みが検査できない。
          dictionary: [
            {
              written: "nox-voice",
              reading: null,
              pinned: false,
              added_at_ms: 1700000000000,
              origin: "manual",
            },
            {
              written: "塩谷",
              reading: "しおや",
              pinned: true,
              added_at_ms: 1700000001000,
              origin: "manual",
            },
            {
              written: "自動候補",
              reading: null,
              pinned: false,
              added_at_ms: 1700000002000,
              origin: "auto",
            },
          ],
          // 3 語目が枠から溢れている状態を初期値にする。**溢れの表示が
          // この機能の本体**なので、全部収まっている状態だけを見ても
          // 何も確かめられない。
          dictionary_status: {
            max_terms: 36,
            max_chars: 140,
            used_terms: 2,
            used_chars: 12,
            in_prompt: [true, true, false],
          },
          formatting_enabled: true,
          injection_enabled: true,
          deep_context: false,
          // 自動学習は**既定で有効**。deep context と逆なので、
          // ここを false にすると「既定 ON」の検査ができなくなる。
          auto_learn_dictionary: true,
          // 実 ConfigView にはあるがモックから抜けていた。Object.assign で初回保存時に
          // 勝手に生えるので今日は動くが、保存前に読むテストを書くと undefined になる。
          screen_ask_enabled: false,
          // 由来の 3 通り (既定 / 既定を編集 / ユーザー作成) をそろえる。
          // 1 種類だけにすると、バッジの出し分けが検査できない。
          style_profiles: [
            {
              process: "slack.exe",
              title_contains: null,
              instruction: "簡潔な口語にする",
              id: "chat.slack",
              user_edited: false,
            },
            {
              process: "chrome|msedge",
              title_contains: "Gmail",
              instruction: "ですます調にする",
              id: "web.gmail",
              user_edited: true,
            },
            {
              process: "myapp.exe",
              title_contains: null,
              instruction: "自作の指示",
              id: "",
              user_edited: false,
            },
          ],
          local_stt_mode: "fallback",
          start_hidden: true,
          // 設定ファイル上の「意思」。UI はこれを見ない (実際の登録は
          // get_autostart が返す) が、ConfigView にはあるので型どおり置く。
          autostart: false,
          hotkey_vk: 0x20,
          hotkey_mods: [0xa2],
          hotkey_label: "左 Ctrl + Space",
          cancel_label: "Esc",
          clipboard_hotkey_vk: 0,
          clipboard_hotkey_mods: [],
          clipboard_hotkey_label: "",
          // ここも実 ConfigView にはあるがモックから抜けていた
          // (screen_ask_enabled と同じ穴)。読むだけのコードが増えた瞬間に
          // undefined を触って落ちるので、型どおり 3 つとも置く。
          screen_ask_hotkey_vk: 0,
          screen_ask_hotkey_mods: [],
          screen_ask_hotkey_label: "",
          sound_enabled: true,
          sound_volume: 60,
          start_sound: "soft_pop",
          start_sound_path: "",
          cancel_sound: "fall",
          cancel_sound_path: "",
          overlay_enabled: true,
          history_enabled: true,
          history_retention_days: 30,
          restore_delay_ms: 400,
          keep_transcript_in_clipboard: true,
          typing_speed_chars_per_min: 300,
          stt_model: "whisper-large-v3-turbo",
          format_model: "gemini-2.5-flash",
          // 控え (Groq) の整形。既定 ON なので、ここを false にすると
          // 「既定 ON」の検査ができなくなる (自動学習と同じ理由)。
          format_fallback_enabled: true,
          groq_format_model: "openai/gpt-oss-20b",
        };

        /** SoundPreset::id() / label() と同じ並び (src-tauri/src/sound.rs)。 */
        const presets = [
          ["silent", "鳴らさない"],
          ["soft_pop", "ソフトポップ"],
          ["chime", "チャイム"],
          ["marimba", "マリンバ"],
          ["bell", "ベル"],
          ["blip", "ブリップ"],
          ["rise", "上昇"],
          ["fall", "下降"],
          ["ding", "ディン"],
          ["knock", "ノック"],
          ["sonar", "ソナー"],
          ["whoosh", "ウーッシュ"],
          ["buzz", "ブザー"],
          ["custom", "ファイルを指定"],
        ].map(([id, label]) => ({ id, label }));

        /** history::SessionRow を模した 1 行。 */
        const historyRow = (id) => ({
          id,
          started_at_ms: 1756200000000 - id * 60000,
          duration_ms: 3200,
          target_process: "code.exe",
          target_hwnd: 0x12345,
          raw_text: `生転写 ${id}`,
          formatted_text: `整形後 ${id}`,
          outcome: "formatted",
          outcome_reason: null,
          stt_ms: 420,
          format_ms: 310,
          inject_outcome: "injected",
          clipboard_state: "restored_original",
          has_audio: false,
          created_at_ms: 1756200000000 - id * 60000,
        });

        const mock = {
          ready: false,
          /** 呼ばれた invoke の記録。テストはこれを読んで往復を確かめる。 */
          invokes: [],
          /** 直近の set_config パッチ。 */
          lastPatch: null,
          /**
           * スタートアップへの登録状態 (レジストリの模擬)。**config とは別物**。
           * 実機でも 2 つはずれうるので、モックでも分けて持つ。
           */
          autostartEnabled: false,
          /** 辞書の何語まで `prompt` に載るか (模擬)。テストから変えられる。 */
          dictPromptCap: 2,
          /** get_history が返す件数。50 でページング条件を満たす。 */
          historyReturn: 50,
          /** window.confirm の答え。headless ではダイアログが出せないので固定する。 */
          confirmAnswer: true,
          /** この VK を一覧から選ぶと「他用途と重複」で無効化される (模擬)。 */
          duplicateVk: null,
          /** lib::StyleSuggestions。テストから差し替えて欠測表示も見る。 */
          styleSuggestions: {
            history_enabled: true,
            total_sessions: 87,
            items: [
              { process: "figma.exe", sessions: 40 },
              { process: "notepad.exe", sessions: 12 },
            ],
          },
          config,
          failing,
          /** コマンド名 -> 応答を遅らせるミリ秒。IPC の往復時間を模す。 */
          delays: {},
          /** 登録済みリスナ: event 名 -> handler id の配列。 */
          listeners: new Map(),
          callbacks: new Map(),
          nextCallbackId: 1,
          nextEventId: 1,
          /** Rust 側の `app.emit(...)` に相当。 */
          emit(name, payload) {
            const ids = mock.listeners.get(name) ?? [];
            for (const id of ids) {
              const cb = mock.callbacks.get(id);
              if (cb) cb({ event: name, id, payload });
            }
            return ids.length;
          },
          /** そのコマンドが何回呼ばれたか。 */
          count(cmd) {
            return mock.invokes.filter((i) => i.cmd === cmd).length;
          },
          /** 直近の引数。 */
          lastArgs(cmd) {
            const hit = [...mock.invokes].reverse().find((i) => i.cmd === cmd);
            return hit ? hit.args : null;
          },
          reset() {
            mock.invokes = [];
          },
        };

        /** `hotkey::describe_keys(code_to_vk(..))` の最小の写し。
         *
         * 網羅はしない。テストで使う code だけを本物と同じ綴りにする
         * (綴りがずれると「経過表示と確定後で名前が違う」を見逃す)。 */
        function describeCodes(codes) {
          const names = {
            ControlLeft: "左 Ctrl",
            ControlRight: "右 Ctrl",
            ShiftLeft: "左 Shift",
            AltLeft: "左 Alt",
            Space: "Space",
            Enter: "Enter",
          };
          return codes
            .map((c) => names[c] ?? (/^F([1-9]|1\d|2[0-4])$/.test(c) ? c : `VK ${c}`))
            .join(" + ");
        }

        /** `lib::list_hotkey_keys` の模擬 (2026-08-31)。
         *
         * **判定の規則は真似しない**。ここが真似ると、Rust の許可規則を
         * 変えた日に両方を直すことになり、しかも「モックが通る」ことしか
         * 保証しなくなる。ここは `hotkey::HotkeyKeyOption` と**同じ形**の
         * データを、代表的なキーだけ並べて返す:
         * - F13 = 単独で選べる (この機能の存在理由。物理キーが無い)
         * - Space = 修飾キーを足したときだけ選べる (状態遷移の検査用)
         * - A = どうやっても選べない (理由を出す経路の検査用)
         * 規則の正しさは Rust の hotkey::tests が見る。 */
        const hotkeyKeyList = {
          max_mods: 3,
          categories: [
            { id: "modifier", label: "修飾キー (左右を区別)", hint: "単独でも組み合わせにも" },
            { id: "function", label: "F キー (F1〜F24)", hint: "F13〜F24 は衝突しません" },
            { id: "edit", label: "編集・移動キー", hint: "" },
            { id: "alnum", label: "英数字", hint: "" },
          ],
          keys: [
            { vk: 0xa2, label: "左 Ctrl", category: "modifier", alone: true, with_mods: true, is_modifier: true, note: "" },
            { vk: 0xa0, label: "左 Shift", category: "modifier", alone: true, with_mods: true, is_modifier: true, note: "" },
            { vk: 0xa5, label: "右 Alt", category: "modifier", alone: true, with_mods: true, is_modifier: true, note: "" },
            { vk: 0x5b, label: "左 Win", category: "modifier", alone: true, with_mods: true, is_modifier: true, note: "" },
            { vk: 0x70, label: "F1", category: "function", alone: true, with_mods: true, is_modifier: false, note: "" },
            { vk: 0x7c, label: "F13", category: "function", alone: true, with_mods: true, is_modifier: false, note: "" },
            { vk: 0x7d, label: "F14", category: "function", alone: true, with_mods: true, is_modifier: false, note: "" },
            { vk: 0x20, label: "Space", category: "edit", alone: false, with_mods: true, is_modifier: false,
              note: "修飾キー (Ctrl / Alt / Shift / Win) を 1 つ以上選ぶと使えます" },
            { vk: 0x0d, label: "Enter", category: "edit", alone: false, with_mods: false, is_modifier: false,
              note: "押している間ずっと入力先アプリへ流れ続けるため、ホットキーには選べません" },
            { vk: 0x41, label: "A", category: "alnum", alone: false, with_mods: false, is_modifier: false,
              note: "押している間ずっと入力先アプリへ流れ続けるため、ホットキーには選べません" },
          ],
        };

        /** `hotkey::describe_keys` の最小の写し (VK 版)。 */
        function describeVks(vks) {
          return vks
            .map((vk) => hotkeyKeyList.keys.find((k) => k.vk === vk)?.label ?? `VK 0x${vk.toString(16)}`)
            .join(" + ");
        }

        /** `dictionary::DictionaryStatus` の**形だけ**を返す模擬。
         *
         * 選抜の規則 (★ → 新しさ) は**真似しない**。モックが判定を
         * 写すと、Rust 側の規則を変えた日に両方直すことになり、
         * しかも「モックが通る」ことしか保証しなくなる。ここは
         * 「枠に上限があって、溢れる語がある」状態を作るだけにする。
         * 規則の正しさは dictionary::tests が見る。 */
        function dictStatus(entries) {
          const cap = mock.dictPromptCap;
          let used = 0;
          let chars = 0;
          const in_prompt = entries.map((e) => {
            const written = (e.written ?? "").trim();
            if (written === "" || used >= cap) return false;
            chars += (used === 0 ? 0 : 1) + [...written].length;
            used += 1;
            return true;
          });
          return { max_terms: 36, max_chars: 140, used_terms: used, used_chars: chars, in_prompt };
        }

        function handle(cmd, args) {
          if (failing.has(cmd)) {
            // Rust 側の `Result::Err(String)` は文字列として reject される。
            return Promise.reject(`模擬エラー: ${cmd}`);
          }
          switch (cmd) {
            case "plugin:event|listen": {
              const ids = mock.listeners.get(args.event) ?? [];
              ids.push(args.handler);
              mock.listeners.set(args.event, ids);
              return Promise.resolve(mock.nextEventId++);
            }
            case "plugin:event|unlisten":
              return Promise.resolve();
            case "get_status":
              return Promise.resolve("idle");
            case "get_last_session":
              return Promise.resolve(null);
            case "get_last_result":
              return Promise.resolve(null);
            case "get_config":
              return Promise.resolve(structuredClone(mock.config));
            case "set_config":
              // Rust の `Config::update` はパッチを反映してから view を返す。
              // ここも同じように反映しないと、`renderConfig` が元の値で
              // チェックボックスを上書きしてしまい、「保存しても画面に残らない」
              // 不具合を検出できない (実機 E2E の代わりにならない穴になる)。
              mock.lastPatch = structuredClone(args.patch);
              Object.assign(mock.config, args.patch);
              // Rust は保存のたびに枠を計算し直す。ここで据え置くと、
              // 行が増えても「枠外」が出ないビューが返り、E2E が
              // 溢れの表示を検査できない穴になる。
              if (args.patch.dictionary) {
                mock.config.dictionary_status = dictStatus(mock.config.dictionary);
              }
              return Promise.resolve(structuredClone(mock.config));
            case "get_autostart":
              return Promise.resolve(mock.autostartEnabled);
            case "set_autostart":
              // Rust 側も登録してから読み直した値を返す。ここも同じ形にして、
              // 「押した値をそのまま信じる」実装を通してしまわないようにする。
              mock.autostartEnabled = args.enabled;
              return Promise.resolve(mock.autostartEnabled);
            case "get_history": {
              const start = args.beforeId == null ? 1000 : args.beforeId - 1;
              const rows = [];
              for (let i = 0; i < mock.historyReturn; i += 1) rows.push(historyRow(start - i));
              return Promise.resolve(rows);
            }
            case "get_storage_stats":
              return Promise.resolve({
                failed_bytes: 0,
                failed_files: 0,
                untranscribed_rows: 0,
              });
            case "get_local_stt_status":
              // local_stt::Availability は `#[serde(tag = "state")]` の内部タグ表現。
              return Promise.resolve({ state: "model_missing", expected_path: "C:\\models\\x.bin" });
            case "preview_dictionary_selection":
              return Promise.resolve(dictStatus(args.entries ?? []));
            case "get_style_suggestions":
              // lib::StyleSuggestions。0 件と欠測を言い分けられるよう、
              // 履歴の有効・無効と総件数も返す形にしてある。
              return Promise.resolve(structuredClone(mock.styleSuggestions));
            case "get_dashboard_stats":
              return Promise.resolve({
                total_chars: 12345,
                total_sessions: 87,
                total_recording_time_ms: 930000,
                time_saved_ms: 1540000,
                daily_stats: [],
              });
            case "list_sound_presets":
              return Promise.resolve(structuredClone(presets));
            case "start_hotkey_capture":
              return Promise.resolve(10);
            case "cancel_hotkey_capture":
              return Promise.resolve();
            // 設定画面が前景のあいだのホットキー (2026-09-26)。フロントは
            // KeyboardEvent.code を順番どおりに送るだけで、解釈は Rust
            // (hotkey::feed_window_key) が行う。モックは記録するだけ。
            case "window_hotkey_key":
              return Promise.resolve();
            // --- キー捕獲は DOM 方式 (2026-08-28)。フロントが集めた
            // `KeyboardEvent.code` の列を Rust へ渡し、VK への変換・許可判定・
            // 表示名は Rust 側が行う (src-tauri/src/hotkey.rs)。
            // モックは**同じ入出力の形**だけを真似る。判定の正しさは
            // Rust の単体テスト側 (hotkey::tests) で見ること。
            case "describe_hotkey_codes":
              return Promise.resolve(describeCodes(args.codes ?? []));
            case "finish_hotkey_capture": {
              const codes = args.codes ?? [];
              // 拒否側も再現する。lib::CaptureVerdict と**同じタグ付きの形**で
              // 返すこと (`Err` ではない — 拒否は捕獲を終わらせない普通の分岐)。
              //
              // Enter は「押しっぱなしで入力先へ流れる」、Space 単独は
              // `is_allowed_hotkey` が許さない。どちらも Rust が拒否する代表例。
              const rejected =
                codes.includes("Enter") ? "Enter"
                : codes.length === 1 && codes[0] === "Space" ? "Space"
                : null;
              if (rejected) {
                return Promise.resolve({
                  verdict: "rejected",
                  message: `「${rejected}」はホットキーに使えません。押している間ずっと入力先へ流れてしまいます。`,
                });
              }
              const label = describeCodes(codes);
              mock.config.hotkey_label = label;
              mock.emit("nox://hotkey-captured", { label });
              return Promise.resolve({ verdict: "accepted" });
            }
            // --- 一覧から選ぶ (2026-08-31)。捕獲と同じ確定経路を通ることは
            // ここでは確かめられない (モックなので)。ここで見るのは
            // 「選んだ VK が Rust へ届き、返ったラベルが画面に出る」往復。
            case "list_hotkey_keys":
              return Promise.resolve(structuredClone(hotkeyKeyList));
            case "describe_hotkey_vks":
              return Promise.resolve(describeVks(args.vks ?? []));
            case "set_hotkey_from_list": {
              const vk = args.vk;
              // `sanitize_combo` の**結論だけ**を真似る (規則は真似ない):
              // 修飾キーとして有効なものだけを残し、トリガー自身は除く。
              const mods = (args.mods ?? []).filter(
                (m) => m !== vk && hotkeyKeyList.keys.find((k) => k.vk === m)?.is_modifier,
              );
              const key = hotkeyKeyList.keys.find((k) => k.vk === vk);
              const usable = key && (mods.length > 0 ? key.with_mods : key.alone);
              if (!usable) {
                return Promise.resolve({
                  verdict: "invalid",
                  message: `「${key?.label ?? vk}」はこの組み合わせでは使えません`,
                });
              }
              const target = {
                inject: "hotkey",
                clipboard_only: "clipboard_hotkey",
                screen_ask: "screen_ask_hotkey",
              }[args.mode ?? "inject"];
              // 他用途との重複は Rust の `Config::normalize` が解消する。
              // **そのとき旧い割り当ても残らない** — normalize は該当用途の
              // `*_vk` を 0 にするので、画面上は「未設定」に戻る。ここを
              // 「元のまま」に模すと、実機と違う楽観的な絵を検査してしまう。
              // (貼り付け用は必ず既定へフォールバックするので dropped に
              // ならない。起きるのは clipboard / screen_ask だけ。)
              if (mock.duplicateVk === vk) {
                mock.config[`${target}_vk`] = 0;
                mock.config[`${target}_mods`] = [];
                mock.config[`${target}_label`] = "";
                mock.emit("nox://hotkey-captured", null);
                return Promise.resolve({
                  verdict: "dropped",
                  message: "その組み合わせは他の用途のホットキーと同じなので設定できません",
                });
              }
              const label = describeVks([...mods, vk]);
              mock.config[`${target}_vk`] = vk;
              mock.config[`${target}_mods`] = mods;
              mock.config[`${target}_label`] = label;
              mock.emit("nox://hotkey-captured", { label });
              return Promise.resolve({ verdict: "applied", label });
            }
            case "clear_hotkey":
              mock.config.clipboard_hotkey_vk = 0;
              mock.config.clipboard_hotkey_mods = [];
              mock.config.clipboard_hotkey_label = "";
              return Promise.resolve(structuredClone(mock.config));
            default:
              // 未知のコマンドは黙って成功させない。Rust 側に無い名前を
              // 呼んでいたら、そこで気づけるようにする。
              return Promise.resolve(null);
          }
        }

        window.__TAURI_INTERNALS__ = {
          transformCallback(callback) {
            const id = mock.nextCallbackId++;
            mock.callbacks.set(id, callback);
            return id;
          },
          invoke(cmd, args = {}) {
            mock.invokes.push({ cmd, args: structuredClone(args ?? {}) });
            const result = handle(cmd, args ?? {});
            // 往復に時間がかかる状況を再現できるようにする。
            //
            // 本物の invoke は IPC なので、呼んでから応答が返るまでに
            // **必ず空白の時間がある**。モックが即座に解決すると、その空白に
            // 依存する不具合 (「フラグを await の後で立てたせいで、その間の
            // キーが素通りする」) がテストをすり抜ける。実測でまさにそれが
            // 起きたので、遅延を注入できるようにした (mock.delays[cmd] = ms)。
            const delay = mock.delays[cmd];
            if (!delay) return result;
            return result.then(
              (v) => new Promise((r) => setTimeout(() => r(v), delay)),
              (e) => new Promise((_, j) => setTimeout(() => j(e), delay)),
            );
          },
        };
        // listen() の unlisten 経路が触る。無いと unlisten で例外になる。
        window.__TAURI_EVENT_PLUGIN_INTERNALS__ = { unregisterListener() {} };
        window.confirm = () => mock.confirmAnswer;
        window.__NOX_MOCK__ = mock;
      })();
    </script>

    <script type="module">
      // index.html の本文をそのまま移植してから main.ts を読み込む。
      const html = await (await fetch("/index.html")).text();
      const doc = new DOMParser().parseFromString(html, "text/html");
      for (const link of doc.querySelectorAll('head link[rel="stylesheet"]')) {
        document.head.append(link.cloneNode(true));
      }
      // head の module script (= /src/main.ts) は移さない。移すと二重に走り、
      // イベントリスナが 2 本ずつ付いて、押していないボタンが 2 回発火する。
      document.body.replaceChildren(...Array.from(doc.body.childNodes));

      await import("/src/main.ts");
      // main.ts は window の DOMContentLoaded で初期化する。動的 import の
      // 時点では既に発火済みなので、こちらから同じ形で起こす。
      window.dispatchEvent(new Event("DOMContentLoaded"));
      // 初期化は非同期 (invoke の往復がある)。get_config まで終わったことを
      // 目印にする — 早すぎる時点で読むと、空欄を「壊れている」と誤判定する。
      const deadline = Date.now() + 10000;
      while (Date.now() < deadline && window.__NOX_MOCK__.count("get_dashboard_stats") === 0) {
        await new Promise((r) => setTimeout(r, 20));
      }
      window.__NOX_MOCK__.ready = true;
    </script>
  </head>
  <body></body>
</html>
