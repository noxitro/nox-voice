name: Release

# タグ vX.Y.Z を push すると、CI と同じ検査を通したうえでインストーラを作り、
# GitHub Release に公開する。
#
#   npm run version:set -- 0.6.0   # 5 ファイル (6 か所) の版を揃える
#   git commit -am "chore: 0.6.0 へ上げる" && git push
#   git tag v0.6.0 && git push origin v0.6.0
#
# 手動実行 (Run workflow) は予行演習: 公開も来歴の証明もせず、作った
# インストーラを Actions の成果物として残すだけ。タグを打つ前に試せる。
#
# 版にハイフンを含むタグ (v0.6.0-beta.1) はプレリリースになる。MSI (WiX) は
# 数字だけの版しか受け付けないので、そのときは NSIS のインストーラだけを作る。
#
# アプリ内の自動更新 (src-tauri/src/updater.rs) のため、インストーラに署名 (.sig) を付け、
# latest.json と一緒に Release へ載せる。アプリは
# releases/latest/download/latest.json を読むので、プレリリースは自動更新に乗らない
# (/latest はプレリリースを指さない)。署名鍵は Secret の TAURI_SIGNING_PRIVATE_KEY と
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD に置く (README「リリースの手順」)。

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # リリースは途中で止めない (半端な Release が残る)
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  build:
    name: インストーラを作る
    needs: ci
    runs-on: windows-latest
    timeout-minutes: 75
    permissions:
      contents: read
      # 来歴の証明 (build provenance attestation) に要る
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v7

      - name: 更新の署名鍵が Secret にあるか
        # 鍵が無いと tauri build が署名の段で落ちる。Rust の準備とビルドに何十分も使ってから落ちる前に、
        # 何を設定すればよいかをここで言う。値はログに出さない (空かどうかだけを見る)。
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $missing = @('TAURI_SIGNING_PRIVATE_KEY', 'TAURI_SIGNING_PRIVATE_KEY_PASSWORD') |
            Where-Object { -not [Environment]::GetEnvironmentVariable($_) }
          if ($missing) {
            "::error::Secret が未設定: $($missing -join ', ')。アプリ内の自動更新の署名に要る (README「リリースの手順」の初回設定)"
            exit 1
          }
          '署名鍵の Secret: 設定済み'

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: npm ci
        run: npm ci

      - name: 版がタグと一致するか
        if: github.event_name == 'push'
        run: node scripts/version.mjs check --tag "${{ github.ref_name }}"

      - name: 版が揃っているか (予行演習)
        if: github.event_name != 'push'
        run: node scripts/version.mjs check

      # 配布物はキャッシュを使わずに作る。このジョブは来歴の証明に書き込み権限を
      # 持つので、サードパーティのアクションは入れない。
      - name: Rust (stable)
        # サードパーティのアクションは使わない (CodeQL: 参照がコミットで固定されていない)。
        # ランナーには rustup が入っているので直接呼ぶ。bash は失敗した行で止まる。
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - name: cargo-about を入れる
        # 版は CI (policy ジョブ) と揃える。about.toml はこの版で検証してある。
        run: cargo install --locked cargo-about --version 0.9.2 --features cli

      - name: 第三者ライセンス表示を作る
        run: npm run notices

      - name: 本体のライセンスを同梱用に置く
        # MSI (tauri-bundler) は、リソースに付けた別名のうちファイル名を使わず元の名前で
        # 入れる (../LICENSE → LICENSE)。NSIS は別名どおり LICENSE.txt で入れるので、
        # 元から LICENSE.txt の名前で置き、どちらでも同じ名前にする
        # (src-tauri/tauri.release.conf.json)。
        run: Copy-Item LICENSE src-tauri/target/release-extras/LICENSE.txt

      - name: インストーラをビルドする
        shell: pwsh
        env:
          # tauri.release.conf.json の createUpdaterArtifacts が、これで .sig を作る
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # exe には依存クレートのソースの絶対パスが panic 位置として埋め込まれる
          # (手元のビルドなら C:\Users\<ユーザー名>\.cargo\...)。付け替えて、
          # どこでビルドしても同じ文字列になるようにする。
          $cargoHome = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { Join-Path $env:USERPROFILE '.cargo' }
          $env:RUSTFLAGS = "--remap-path-prefix=$cargoHome=cargo --remap-path-prefix=$env:GITHUB_WORKSPACE=nox-voice"
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $bundles = if ($version -match '-') { 'nsis' } else { 'nsis,msi' }
          "版 $version / バンドル $bundles"
          # tauri.release.conf.json が LICENSE と THIRD_PARTY_NOTICES.txt をインストール先へ入れる
          npx tauri build --ci --config src-tauri/tauri.release.conf.json --bundles $bundles
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 成果物とハッシュを揃える
        shell: pwsh
        env:
          # 式を run に直接埋め込まない (スクリプトの注入を避ける定石)
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $out = New-Item -ItemType Directory -Force release-assets
          # .sig は自動更新の署名。latest.json に中身を写すが、ファイルとしても載せておく
          Copy-Item src-tauri/target/release/bundle/nsis/*-setup.exe, src-tauri/target/release/bundle/nsis/*-setup.exe.sig $out
          if (Test-Path src-tauri/target/release/bundle/msi) {
            Copy-Item src-tauri/target/release/bundle/msi/*.msi, src-tauri/target/release/bundle/msi/*.msi.sig $out
          }
          Copy-Item src-tauri/target/release-extras/THIRD_PARTY_NOTICES.txt $out
          # 自動更新が読む latest.json。署名を tauri.conf.json の pubkey で確かめてから書く
          # (別の鍵を Secret に入れていたら、ここで落ちて公開されない)。
          # 予行演習 (手動実行) はタグが無いので、package.json の版から組み立てる。
          $tag = if ($env:EVENT_NAME -eq 'push') { $env:REF_NAME } else {
            'v' + (Get-Content package.json -Raw | ConvertFrom-Json).version
          }
          node scripts/updater-manifest.mjs --dir $out --tag $tag
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Content (Join-Path $out 'latest.json')
          # sha256sum -c でもそのまま使える書式 ("<ハッシュ>  <ファイル名>")
          Get-ChildItem $out -File | Sort-Object Name | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content -Path (Join-Path $out 'SHA256SUMS.txt') -Encoding ascii
          Get-Content (Join-Path $out 'SHA256SUMS.txt')

      - name: NSIS インストーラを実際に入れて起動を確かめる
        shell: pwsh
        run: |
          $setup = Get-ChildItem release-assets -Filter '*-setup.exe' | Select-Object -First 1
          $p = Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "インストーラが失敗した (exit $($p.ExitCode))" }
          # インストール先はアンインストール情報から読む。無ければユーザー単位の
          # インストール (Tauri の NSIS の既定) の %LOCALAPPDATA%\<productName>。
          $reg = Get-ChildItem 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall' -ErrorAction SilentlyContinue |
            Get-ItemProperty | Where-Object { $_.DisplayName -eq 'nox-voice' } | Select-Object -First 1
          $dir = if ($reg.InstallLocation) { $reg.InstallLocation.Trim('"') } else { Join-Path $env:LOCALAPPDATA 'nox-voice' }
          foreach ($f in 'nox-voice.exe', 'LICENSE.txt', 'THIRD_PARTY_NOTICES.txt', 'uninstall.exe') {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "インストール先に $f が無い ($dir)" }
          }
          "インストール先: $dir"
          $env:NOX_E2E_EXE = Join-Path $dir 'nox-voice.exe'
          node e2e/single-instance.mjs
          if ($LASTEXITCODE -ne 0) { throw 'インストールした exe で多重起動の E2E が落ちた' }
          # _?= を付けると、アンインストーラが一時コピーから走り直さずその場で動く。
          # 付けないと -Wait が本体の終了を待てない (uninstall.exe 自身は残る)。
          $u = Start-Process -FilePath (Join-Path $dir 'uninstall.exe') -ArgumentList '/S', "_?=$dir" -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "アンインストーラが失敗した (exit $($u.ExitCode))" }
          if (Test-Path (Join-Path $dir 'nox-voice.exe')) { throw 'アンインストール後も exe が残っている' }
          # NSIS はインストール先を HKCU\Software\<発行者>\<製品名> の既定値に書き、サイレントの
          # アンインストールでは消さない (アプリのデータも消す指定のときだけ消す)。Tauri の MSI は
          # この値を「前回のインストール先」として読んでそこへ入れるので、残すと次の MSI の確認が
          # %LOCALAPPDATA% に入ってしまう。新しい PC と同じ状態に戻してから MSI を確かめる。
          $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          Remove-Item "HKCU:\Software\$($conf.bundle.publisher)\$($conf.productName)" -Recurse -ErrorAction SilentlyContinue

      - name: MSI インストーラを実際に入れて起動を確かめる
        if: ${{ hashFiles('release-assets/*.msi') != '' }}
        shell: pwsh
        run: |
          $msi = Get-ChildItem release-assets -Filter '*.msi' | Select-Object -First 1
          $log = Join-Path $env:RUNNER_TEMP 'msi-install.log'
          $p = Start-Process msiexec.exe -ArgumentList '/i', "`"$($msi.FullName)`"", '/qn', '/l*v', "`"$log`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content $log -Tail 40; throw "MSI のインストールが失敗した (exit $($p.ExitCode))" }
          # インストール先は MSI 自身が HKCU\Software\<発行者>\<製品名> の InstallDir に記録する。
          # 新しい PC なら PC 全体向け (Program Files) に入る。前回の NSIS の場所を引き継いで
          # いないことも、ここで確かめる (上の NSIS の確認の最後を参照)。
          $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $key = "HKCU:\Software\$($conf.bundle.publisher)\$($conf.productName)"
          $dir = (Get-ItemProperty $key -Name InstallDir -ErrorAction SilentlyContinue).InstallDir
          if (-not $dir) { throw "MSI がインストール先を記録していない ($key の InstallDir)" }
          $dir = $dir.TrimEnd('\')
          $expected = Join-Path $env:ProgramFiles $conf.productName
          if ($dir -ne $expected) { throw "MSI のインストール先が想定と違う: $dir (想定: $expected)" }
          foreach ($f in 'nox-voice.exe', 'LICENSE.txt', 'THIRD_PARTY_NOTICES.txt') {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "インストール先に $f が無い ($dir)" }
          }
          "インストール先: $dir"
          $env:NOX_E2E_EXE = Join-Path $dir 'nox-voice.exe'
          node e2e/single-instance.mjs
          if ($LASTEXITCODE -ne 0) { throw 'MSI で入れた exe で多重起動の E2E が落ちた' }
          $u = Start-Process msiexec.exe -ArgumentList '/x', "`"$($msi.FullName)`"", '/qn' -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "MSI のアンインストールが失敗した (exit $($u.ExitCode))" }
          if (Test-Path $env:NOX_E2E_EXE) { throw 'MSI のアンインストール後も exe が残っている' }

      - name: 来歴の証明 (このリポジトリのこのタグからビルドしたこと)
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            release-assets/*.exe
            release-assets/*.msi

      - uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: release-assets/
          if-no-files-found: error

  publish:
    name: GitHub Release に公開する
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Release を作るのはこのジョブだけ
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: release-assets

      - name: リリースノートを組み立てて公開する
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          setup="$(cd release-assets && ls -- *-setup.exe)"
          prerelease=""
          case "$version" in *-*) prerelease="--prerelease" ;; esac

          {
            echo "## インストール"
            echo
            echo "\`$setup\` を実行してください (ユーザー単位のインストールで、管理者権限は要りません)。"
            if ls release-assets/*.msi >/dev/null 2>&1; then
              echo "PC 全体へ入れる場合は MSI (\`$(cd release-assets && ls -- *.msi)\`) を使います。"
            fi
            echo
            echo "> 署名していないため、SmartScreen が警告を出します。「詳細情報」→「実行」で進めてください。"
            echo
            echo "## ダウンロードしたファイルの確かめ方"
            echo
            echo "- **ハッシュ**: \`SHA256SUMS.txt\` と照合できます (PowerShell: \`Get-FileHash .\\$setup\`)"
            echo "- **来歴**: この Release のインストーラは、GitHub Actions がこのリポジトリの \`$TAG\` からビルドしたものです。GitHub CLI で検証できます:"
            echo
            echo '  ```'
            echo "  gh attestation verify $setup --repo $GITHUB_REPOSITORY"
            echo '  ```'
            echo
            echo "同梱している第三者ソフトウェアのライセンス表示は \`THIRD_PARTY_NOTICES.txt\` にあります (インストール先にも入ります)。"
            echo
            echo "\`latest.json\` と \`*.sig\` はアプリ内の自動更新が読むファイルです (手で使うものではありません)。"
            echo
            gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$TAG" --jq .body
          } > notes.md

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # 再実行: 既にある Release の成果物だけを差し替える
            gh release upload "$TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" release-assets/* --repo "$GITHUB_REPOSITORY" \
              --title "nox-voice $version" --notes-file notes.md --verify-tag $prerelease
          fi
