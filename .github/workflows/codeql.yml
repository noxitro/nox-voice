name: CodeQL

# コードの静的解析 (GitHub の code scanning)。public リポジトリでは無料。
# 結果はリポジトリの Security タブに出る。
#
# 設定画面の「default setup」とは併用できない (どちらか一方)。こちらを使う。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 毎週月曜 03:27 (UTC)。依存やクエリの更新で新しく見つかるものを拾う。
    - cron: "27 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # ワークフロー自体 (権限の広げすぎ、untrusted な入力の埋め込み等)
          - language: actions
            os: ubuntu-latest
          - language: javascript-typescript
            os: ubuntu-latest
          # Rust は #[cfg(windows)] のコードを解析対象に入れるため Windows で走らせる
          - language: rust
            os: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
