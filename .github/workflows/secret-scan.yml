# 秘密情報スキャン。本体は noxitro/github-templates の共通ワークフロー。
#
# paths-ignore は置かない。ドキュメントだけの変更 (API キーを貼った README など) も検査するため。
# concurrency も付けない。push ごとの差分 (before..sha) を検査するので、1 本でも実行が消えると
# その push の範囲が検査されないまま残る。
name: Secret scan

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    uses: noxitro/github-templates/.github/workflows/secret-scan.yml@main
